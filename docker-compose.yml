version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: loganalyzer
      POSTGRES_PASSWORD: loganalyzer
      POSTGRES_DB: log_analyzer
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loganalyzer -d log_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: elasticsearch:8.17.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  kafka:
    image: apache/kafka:3.7.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: TZyCSe7oRYmCnMkoeQ6vmA
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9092'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  analyzer:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      LOG_ANALYZER_DSN: "postgresql://loganalyzer:loganalyzer@postgres:5432/log_analyzer"
    volumes:
      - ./logs:/app/logs:ro
      - ./reports:/app/reports
    # Add --kafka-broker kafka:9092 to publish incidents to the kafka service.
    command: ["/app/logs/auth.log", "--report", "/app/reports/report.html",
              "--es-host", "http://elasticsearch:9200"]

  log-shipper:
    build:
      context: .
      dockerfile: Dockerfile.log-shipper
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./logs:/logs:ro
      - shipper_state:/var/lib/log-shipper
    # Pass additional log file paths as extra positional arguments.
    command: ["--broker", "kafka:9092", "--topic", "raw-logs", "/logs/auth.log"]

volumes:
  pgdata:
  shipper_state:
