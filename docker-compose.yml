version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: loganalyzer
      POSTGRES_PASSWORD: loganalyzer
      POSTGRES_DB: log_analyzer
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loganalyzer -d log_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: elasticsearch:8.17.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  analyzer:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      LOG_ANALYZER_DSN: "postgresql://loganalyzer:loganalyzer@postgres:5432/log_analyzer"
    volumes:
      - ./logs:/app/logs:ro
      - ./reports:/app/reports
    command: ["/app/logs/auth.log", "--report", "/app/reports/report.html",
              "--es-host", "http://elasticsearch:9200"]

volumes:
  pgdata:
