{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "soc-stack.secretName" . }}
  namespace: security-tools
  labels:
    {{- include "soc-stack.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgres.enabled }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:5432/%s" .Values.postgres.user .Values.secrets.postgresPassword (include "soc-stack.postgresHost" .) .Values.postgres.database | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  {{- else }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  {{- end }}
  LOG_ANALYZER_DSN: {{ .Values.secrets.logAnalyzerDsn | quote }}
  SOC_ALERTS_API_KEY: {{ .Values.secrets.socAlertsApiKey | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  DB_ENCRYPTION_KEY: {{ .Values.secrets.dbEncryptionKey | quote }}
  FLASK_SECRET_KEY: {{ .Values.secrets.flaskSecretKey | quote }}
  ALERTS_API_KEY: {{ .Values.secrets.alertsApiKey | quote }}
{{- end }}
