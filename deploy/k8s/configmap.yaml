apiVersion: v1
kind: ConfigMap
metadata:
  name: log-analyzer-config
  namespace: security-tools
data:
  config.yaml: |
    thresholds:
      brute_force:
        count: 5
        window_seconds: 600
      port_scan:
        count: 20
        window_seconds: 300
      flood_404:
        count: 30
        window_seconds: 300
    allowlist:
      - "127.0.0.1"
      - "::1"
