# Copy to secret.yaml, fill in values, then:
#   kubectl apply -f secret.yaml -n security-tools
# Never commit secret.yaml to version control.
apiVersion: v1
kind: Secret
metadata:
  name: log-analyzer-secrets
  namespace: security-tools
type: Opaque
stringData:
  LOG_ANALYZER_DSN: "postgresql://USER:PASSWORD@postgres-host:5432/log_analyzer"
  SOC_ALERTS_API_KEY: "YOUR_SOC_API_KEY"
  ANTHROPIC_API_KEY: "YOUR_ANTHROPIC_API_KEY"
  DB_ENCRYPTION_KEY: "YOUR_FERNET_COMPATIBLE_KEY"
