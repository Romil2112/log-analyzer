steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/log-analyzer/app:$COMMIT_SHA
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/log-analyzer/app:latest
      - .
  - name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, us-central1-docker.pkg.dev/$PROJECT_ID/log-analyzer/app]

images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/log-analyzer/app:$COMMIT_SHA
  - us-central1-docker.pkg.dev/$PROJECT_ID/log-analyzer/app:latest

options:
  logging: CLOUD_LOGGING_ONLY
